version: '3.9'

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: central_one
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-central123}
      POSTGRES_DB: central_one
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U central_one -d central_one']
      interval: 10s
      timeout: 5s
      retries: 5

  server:
    build:
      context: .
      target: server
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      SERVER_PORT: 4000
      SERVER_NODE_ENV: production
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:80}
      DATABASE_URL: postgresql://central_one:${POSTGRES_PASSWORD:-central123}@postgres:5432/central_one
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET}
      UPLOAD_DIR: /app/uploads
    ports:
      - '4000:4000'
    volumes:
      - uploads_data:/app/uploads
      - backups_data:/app/server/uploads/backups
    command: >
      sh -c "npx prisma db push && node dist/index.js"

  client:
    build:
      context: .
      target: client
    restart: unless-stopped
    depends_on:
      - server
    ports:
      - '80:80'

volumes:
  postgres_data:
  uploads_data:
  backups_data:
